<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dh_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="dh_accent_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="dh_arrow_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="dh_gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="dh_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Base Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#dh_bg_grad)" filter="url(#dh_glow)" />
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6" />

  <!-- 2. Ledger Lines -->
  <path d="M120 140 H392 M120 200 H392 M120 260 H300" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="16" stroke-linecap="round" />

  <!-- 3. Interlocking 'D' Monogram -->
  <path d="M140 120 V392" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" />
  <path d="M140 120 H250 C340 120, 380 180, 380 256 C380 332, 340 392, 250 392 H140" stroke="url(#dh_accent_grad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 4. 'H' Right Pillar -->
  <path d="M320 160 V392" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" />

  <!-- 5. 'H' Crossbar & Rising Growth Arrow -->
  <path d="M140 256 H270 L380 146" stroke="url(#dh_arrow_grad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M310 146 H380 V216" stroke="url(#dh_arrow_grad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 6. Golden Coin Accent -->
  <circle cx="236" cy="312" r="32" fill="url(#dh_gold_grad)" />
  <path d="M236 294 V330 M224 304 H248 C252 304 252 312 236 312 C220 312 220 320 224 320 H248" stroke="#78350F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
