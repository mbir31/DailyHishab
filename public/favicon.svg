<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    {/* Background Squircle Gradient (Sapphire Blue to Deep Emerald/Teal) */}
    <linearGradient id="dh_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    {/* Ledger Page Gradient */}
    <linearGradient id="dh_ledger_page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    {/* BDT Currency Symbol (৳) Gold Gradient */}
    <linearGradient id="dh_bdt_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    {/* Ascending Growth Arrow Gradient (Emerald-Cyan) */}
    <linearGradient id="dh_growth_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    {/* Bar Chart Gradients */}
    <linearGradient id="dh_bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="dh_bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9" />
    </linearGradient>

    <filter id="dh_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E40AF" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="dh_gold_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Outer Squircle Badge with Glow -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#dh_bg_grad)" filter="url(#dh_glow)" />

  <!-- Inner Metallic Glass Border -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6" />

  <!-- 2. Open Ledger Book Foundation (Left & Right Pages) -->
  <path d="M96 360 C 140 340, 210 340, 248 356 V 200 C 210 184, 140 184, 96 204 Z" fill="url(#dh_ledger_page)" fill-opacity="0.95" />
  <path d="M416 360 C 372 340, 302 340, 264 356 V 200 C 302 184, 372 184, 416 204 Z" fill="url(#dh_ledger_page)" fill-opacity="0.85" />
  <path d="M256 190 V 368" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />

  <!-- Ledger Page Lines -->
  <path d="M120 236 C 160 224, 210 224, 236 234 M120 272 C 160 260, 210 260, 236 270 M120 308 C 160 296, 210 296, 236 306" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
  <path d="M392 236 C 352 224, 302 224, 276 234 M392 272 C 352 260, 302 260, 276 270 M392 308 C 352 296, 302 296, 276 306" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />

  <!-- 3. Ascending Financial Growth Bar Chart -->
  <rect x="136" y="270" width="22" height="50" rx="6" fill="url(#dh_bar1)" />
  <rect x="172" y="240" width="22" height="80" rx="6" fill="url(#dh_bar1)" />
  <rect x="318" y="220" width="22" height="100" rx="6" fill="url(#dh_bar2)" />
  <rect x="354" y="180" width="22" height="140" rx="6" fill="url(#dh_bar2)" />

  <!-- 4. Prominent BDT Currency Symbol (৳) in Center Gold Glow -->
  <g filter="url(#dh_gold_glow)">
    <path d="M228 170 C210 150, 180 160, 180 186 C180 210, 205 218, 236 220" stroke="url(#dh_bdt_gold)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M236 140 V 330" stroke="url(#dh_bdt_gold)" stroke-width="30" stroke-linecap="round" />
    <path d="M200 248 H 272" stroke="url(#dh_bdt_gold)" stroke-width="26" stroke-linecap="round" />
    <path d="M236 330 C236 355, 275 355, 290 330" stroke="url(#dh_bdt_gold)" stroke-width="26" stroke-linecap="round" fill="none" />
  </g>

  <!-- 5. Ascending Growth Trend Arrow -->
  <path d="M110 330 Q 230 260, 390 120" stroke="url(#dh_growth_grad)" stroke-width="32" stroke-linecap="round" fill="none" />
  <path d="M320 120 H 390 V 190" stroke="url(#dh_growth_grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Financial Nodes -->
  <circle cx="390" cy="120" r="16" fill="#FDE047" />
  <circle cx="270" cy="235" r="10" fill="#38BDF8" />
  <circle cx="170" cy="295" r="8" fill="#34D399" />
</svg>
